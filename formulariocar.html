
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro de Autos</title>
    <link rel="stylesheet" href="estilos/normalize.css">
    <link rel="stylesheet" href="estilos/forcar.css">
</head>
<body>
  <div class="form-container">
      <h2>Registro de Autos</h2>
      <form action="#" method="get">
          <div class="form-group">
              <label for="marca">Marca</label>
              <select id="marca" name="marca" required>
                <option value="Honda">Honda</option>
                <option value="Toyota">Toyota</option>
                <option value="Tesla Inc">Tesla Inc</option>
                <option value="BMW Group">BMW Group</option>
                <option value="Ford">Ford</option>
              </select>
          </div>
          <div class="form-group">
              <label for="modelo">Modelo</label>
              <input type="text" id="modelo" name="modelo" required>
          </div>
          <div class="form-group">
              <label for="anio">Año</label>
              <input type="text" id="anio" name="anio" required>
          </div>
          <div class="form-group">
              <label for="color">Color</label>
              <input type="color" id="color" name="color" required>
          </div>
          <div class="form-group">
              <label for="placa">Placa</label>
              <input type="text" id="placa" name="placa" required>
          </div>
          <div class="form-group">
              <label for="propietario">Propietario</label>
              <input type="text" id="propietario" name="propietario" required>
          </div>
          <div class="form-group">
              <input type="submit" value="Registrar Vehículo">
          </div>
      </form>
  </div>
</body>
</html>
